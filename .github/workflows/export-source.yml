name: Export source

on:
  push:
    branches: [automation/export-guided-intake-source]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/export-guided-intake-source
      - uses: actions/upload-artifact@v4
        with:
          name: guided-intake-source
          path: .
          include-hidden-files: true
          retention-days: 1
