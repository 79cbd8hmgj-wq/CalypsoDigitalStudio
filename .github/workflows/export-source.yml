name: Export source

on:
  push:
    branches: [automation/export-guided-intake-source]
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/export-guided-intake-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm install --save-exact --save-dev vitest happy-dom @playwright/test wrangler @cloudflare/workers-types
      - run: tar -czf intake-dev-dependencies.tgz package.json package-lock.json node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: guided-intake-source
          path: .
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: guided-intake-dev-dependencies
          path: intake-dev-dependencies.tgz
          retention-days: 1
