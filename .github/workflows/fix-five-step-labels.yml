name: Correct five-step labels

on:
  push:
    branches:
      - feat/remove-budget-step
    paths:
      - .github/workflows/fix-five-step-labels.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remove-budget-step
          fetch-depth: 0

      - name: Update labels and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changes = {
              'src/components/intake/steps/BusinessStep.astro': ('Step 1 of 6', 'Step 1 of 5'),
              'src/components/intake/steps/ProjectStep.astro': ('Step 2 of 6', 'Step 2 of 5'),
              'src/components/intake/steps/NeedsStep.astro': ('Step 3 of 6', 'Step 3 of 5'),
              'src/components/intake/steps/MaterialsStep.astro': ('Step 4 of 6', 'Step 4 of 5'),
          }
          for filename, (old, new) in changes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: expected exactly one {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm .github/workflows/fix-five-step-labels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix five-step progress labels'
          git push origin HEAD:feat/remove-budget-step
