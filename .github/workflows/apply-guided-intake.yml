name: Apply guided intake implementation

on:
  push:
    branches: [implementation/guided-intake-form]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/guided-intake-form
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Apply implementation patch
        run: |
          cat .implementation/patchpart-* | base64 -d | gzip -d > /tmp/intake.patch
          git apply --index /tmp/intake.patch
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one match in {path}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          needs = Path('src/components/intake/steps/NeedsStep.astro')
          text = needs.read_text()
          text = text.replace('  goalOptions,\n', '')
          text = text.replace('  yesNoNotSureOptions\n', '')
          text = text.replace(')[value] }));', ')[value] ?? value }));')
          needs.write_text(text)

          materials = Path('src/components/intake/steps/MaterialsStep.astro')
          text = materials.read_text()
          text = text.replace(')[value] }));', ')[value] ?? value }));')
          materials.write_text(text)

          test_file = 'tests/e2e/intake.spec.ts'
          replace_once(
              test_file,
              "await page.getByLabel('Business email').fill('jordan@example.com');",
              "await page.getByRole('textbox', { name: 'Business email (required)' }).fill('jordan@example.com');"
          )
          replace_once(
              test_file,
              "  await page.getByLabel(label).check();\n  for (const addition of additions) await page.getByLabel(addition).check();",
              "  await page.getByRole('radio', { name: label }).check();\n  for (const addition of additions) await page.getByRole('checkbox', { name: addition }).check();"
          )
          replace_once(
              test_file,
              "  await page.getByLabel('Look more professional').check();\n  await page.getByLabel('Home').check();\n  await page.getByLabel('Contact').check();\n  await page.getByLabel('Contact form').check();",
              "  await page.locator('#needs-goals-professional').check();\n  await page.locator('#needs-pages-home').check();\n  await page.locator('#needs-pages-contact').check();\n  await page.locator('#needs-features-contact-form').check();"
          )
          replace_once(
              test_file,
              "await page.getByLabel('Approximate budget range').selectOption('1000-2500');",
              "await page.locator('#budget-website').selectOption('1000-2500');"
          )
          replace_once(
              test_file,
              "await expect(page.getByText(/2–3 business days/)).toBeVisible();",
              "await expect(page.locator('[data-confirmation-message]')).toContainText('2–3 business days');"
          )
          replace_once(
              test_file,
              "await expect(page.getByText('Step 6 of 6')).toBeVisible();",
              "await expect(page.getByText('Step 6 of 6', { exact: true })).toBeVisible();"
          )
          replace_once(
              test_file,
              "await expect(page.getByText('Step 1 of 6')).toBeVisible();",
              "await expect(page.getByText('Step 1 of 6', { exact: true })).toBeVisible();"
          )
          PY
          git restore --source=HEAD --staged --worktree .github/workflows/validate.yml
          git diff --check
          rm -rf .implementation
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run foundation and intake tests
        run: npm test
      - name: Verify assets
        run: npm run verify:assets
      - name: Verify content
        run: npm run verify:content
      - name: Run Astro and TypeScript checks
        run: npm run check
      - name: Build production site
        run: npm run build
      - name: Verify production output
        run: npm run verify:build
      - name: Run browser tests
        run: npm run test:e2e
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply guided intake implementation"
          git push origin HEAD:implementation/guided-intake-form
