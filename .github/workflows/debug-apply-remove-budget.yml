name: Diagnose and apply five-step intake

on:
  push:
    branches: [feat/remove-budget-step]
    paths:
      - .github/workflows/debug-apply-remove-budget.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remove-budget-step
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Extract and run patch script
        id: patch
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/apply-remove-budget-step.yml').read_text(encoding='utf-8')
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply-remove-budget.py').write_text(script, encoding='utf-8')
          result = subprocess.run(['python', '/tmp/apply-remove-budget.py'], text=True, capture_output=True)
          Path('apply-budget-debug.log').write_text(
              f'exit={result.returncode}\n\nSTDOUT\n{result.stdout}\n\nSTDERR\n{result.stderr}',
              encoding='utf-8'
          )
          raise SystemExit(result.returncode)
          PY
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit diagnostic on patch failure
        if: steps.patch.outputs.status != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apply-budget-debug.log
          git commit -m 'Record budget-step patch diagnostic'
          git push origin HEAD:feat/remove-budget-step

      - name: Install locked dependencies
        if: steps.patch.outputs.status == '0'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.patch.outputs.status == '0'
        run: npx playwright install --with-deps chromium webkit

      - name: Verify implementation
        if: steps.patch.outputs.status == '0'
        run: |
          npm test
          npm run verify:assets
          npm run verify:content
          npm run check
          npm run build
          npm run verify:build
          npm run test:e2e

      - name: Commit verified implementation
        if: steps.patch.outputs.status == '0'
        run: |
          rm .github/workflows/apply-remove-budget-step.yml
          rm .github/workflows/debug-apply-remove-budget.yml
          rm apply-budget-debug.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement five-step intake without budget questions'
          git push origin HEAD:feat/remove-budget-step
