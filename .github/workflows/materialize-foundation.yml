name: Materialize website foundation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/astro-site
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Install image tools
        if: ${{ hashFiles('.bootstrap/text-payload.b64') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick

      - name: Expand project source
        if: ${{ hashFiles('.bootstrap/text-payload.b64') != '' }}
        run: |
          base64 --decode .bootstrap/text-payload.b64 > /tmp/calypso-text.tar.gz
          tar -xzf /tmp/calypso-text.tar.gz -C .
          rm -f .github/workflows/bootstrap-lockfile.yml
          mkdir -p public/assets/brand
          cp .bootstrap/assets/public/assets/brand/calypso-master.svg public/assets/brand/calypso-master.svg

      - name: Generate optimized portfolio artwork from source archive
        if: ${{ hashFiles('.bootstrap/text-payload.b64') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/calypso-source /tmp/calypso-render
          mkdir -p /tmp/calypso-source /tmp/calypso-render
          unzip -q 'Archive 9.zip' -d /tmp/calypso-source
          find /tmp/calypso-source -name '._*' -delete

          render_svg() {
            local pdf="$1"
            local slug="$2"
            local output="$3"
            mkdir -p "$(dirname "$output")"
            pdftoppm -f 1 -singlefile -jpeg -r 144 "$pdf" "/tmp/calypso-render/$slug"
            convert "/tmp/calypso-render/$slug.jpg" -gravity north -crop 828x1500+0+0 +repage -resize '460x833!' -strip -quality 78 "/tmp/calypso-render/$slug.webp"
            python - "$slug" "$output" <<'PY'
          import base64
          import pathlib
          import sys

          slug, output = sys.argv[1], pathlib.Path(sys.argv[2])
          data = base64.b64encode(pathlib.Path(f'/tmp/calypso-render/{slug}.webp').read_bytes()).decode('ascii')
          output.write_text(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 833" width="460" height="833">'
              f'<image width="460" height="833" href="data:image/webp;base64,{data}"/>'
              '</svg>',
              encoding='utf-8'
          )
          PY
          }

          render_svg '/tmp/calypso-source/Portfolio | LRL Photography.pdf' 'lrl-portfolio' 'public/assets/projects/lrl-photography/portfolio-mobile.svg'
          render_svg '/tmp/calypso-source/Book a Session | LRL Photography.pdf' 'lrl-booking' 'public/assets/projects/lrl-photography/booking-mobile.svg'
          render_svg '/tmp/calypso-source/Rare Treats 518.pdf' 'rare-home' 'public/assets/projects/rare-treats-518/home-mobile.svg'
          render_svg '/tmp/calypso-source/Custom Orders | Rare Treats 518.pdf' 'rare-orders' 'public/assets/projects/rare-treats-518/custom-orders-mobile.svg'
          render_svg '/tmp/calypso-source/Good Intentions.pdf' 'good-home' 'public/assets/projects/good-intentions/home-mobile.svg'
          render_svg '/tmp/calypso-source/Style bundles | Good Intentions.pdf' 'good-bundles' 'public/assets/projects/good-intentions/style-bundles-mobile.svg'

      - name: Generate npm lockfile
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Validate foundation
        run: |
          npm test
          npm run verify:assets
          npm run verify:content
          npm run check
          npm run build
          npm run verify:build

      - name: Commit materialized foundation
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-lockfile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Foundation already materialized and validated.'
            exit 0
          fi
          git commit -m 'Materialize Astro website foundation'
          git push origin HEAD:foundation/astro-site
