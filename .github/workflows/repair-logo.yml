name: Repair master logo asset

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/astro-site
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Rebuild logo from the supplied master image
        run: |
          set -euo pipefail
          rm -rf /tmp/calypso-logo
          mkdir -p /tmp/calypso-logo
          unzip -q 'Archive 9.zip' -d /tmp/calypso-logo
          find /tmp/calypso-logo -name '._*' -delete
          logo=$(find /tmp/calypso-logo -type f \( -iname '*.jpeg' -o -iname '*.jpg' \) | head -1)
          test -n "$logo"
          convert "$logo" -auto-orient -resize '1200x1200>' -strip -quality 88 public/assets/brand/calypso-master.webp
          rm -f public/assets/brand/calypso-master.svg

          python <<'PY'
          from pathlib import Path

          files = [
              Path('src/layouts/BaseLayout.astro'),
              Path('src/pages/about.astro'),
              Path('scripts/verify-assets.mjs'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('calypso-master.svg', 'calypso-master.webp')
              if path.name == 'about.astro':
                  text = text.replace('width="1400" height="1400"', 'width="1200" height="1200"')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate repaired foundation
        run: |
          npm ci
          npm test
          npm run verify:assets
          npm run verify:content
          npm run check
          npm run build
          npm run verify:build

      - name: Commit repaired logo
        run: |
          rm .github/workflows/repair-logo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair master logo asset'
          git push origin HEAD:foundation/astro-site
