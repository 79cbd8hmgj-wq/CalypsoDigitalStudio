name: Apply Turnstile answer boundary fix

on:
  push:
    branches:
      - fix/turnstile-answer-boundary
    paths:
      - .github/workflows/apply-turnstile-answer-boundary.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/turnstile-answer-boundary
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add failing Turnstile regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/intake/wizard.test.ts')
          text = path.read_text()
          marker = "test('sendIntakeRequest posts JSON and returns the safe success payload', async () => {"
          test = r'''test('Turnstile hidden response is never saved as a project answer', () => {
            initializeIntakeWizard(root);
            (root.querySelector('[data-start-intake]') as HTMLButtonElement).click();

            const form = root.querySelector('[data-intake-form]') as HTMLFormElement;
            const hiddenResponse = window.document.createElement('input') as unknown as HTMLInputElement;
            hiddenResponse.type = 'hidden';
            hiddenResponse.name = 'cf-turnstile-response';
            hiddenResponse.value = 'verified-token';
            form.append(hiddenResponse);
            hiddenResponse.dispatchEvent(new window.Event('input', { bubbles: true }) as unknown as Event);
            (root.querySelector('[data-progress-step="0"]') as HTMLButtonElement).click();

            const stored = JSON.parse(window.localStorage.getItem(DRAFT_KEY) ?? '{}');
            expect(stored.answers).not.toHaveProperty('cf-turnstile-response');
          });

          '''
          if marker not in text:
              raise SystemExit('Could not locate wizard test insertion point')
          if "Turnstile hidden response is never saved as a project answer" in text:
              raise SystemExit('Regression test already exists unexpectedly')
          path.write_text(text.replace(marker, test + marker, 1))
          PY

      - name: Confirm regression test fails before implementation
        shell: bash
        run: |
          set +e
          npx vitest run tests/intake/wizard.test.ts -t "Turnstile hidden response is never saved as a project answer" 2>&1 | tee /tmp/turnstile-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the regression test to fail before the implementation."
            exit 1
          fi
          grep -Fq "Turnstile hidden response is never saved as a project answer" /tmp/turnstile-red.log
          grep -Fq "cf-turnstile-response" /tmp/turnstile-red.log

      - name: Separate security metadata from project answer fields
        shell: bash
        run: |
          cat > src/lib/intake/form-fields.ts <<'EOF'
          const INTAKE_ANSWER_PREFIXES = [
            'business.',
            'project.',
            'needs.',
            'materials.',
            'budgetAndTiming.',
            'contact.',
            'consent.'
          ] as const;

          export function isIntakeAnswerFieldName(name: string): boolean {
            return INTAKE_ANSWER_PREFIXES.some((prefix) => name.startsWith(prefix));
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_name: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path_name}: expected {expected} matches, found {count}')
              path.write_text(text.replace(old, new))

          replace_exact(
              'src/scripts/intake-wizard.ts',
              "import { buildSummarySections } from '../lib/intake/email';\nimport { createSubmissionReference } from '../lib/intake/reference';",
              "import { buildSummarySections } from '../lib/intake/email';\nimport { isIntakeAnswerFieldName } from '../lib/intake/form-fields';\nimport { createSubmissionReference } from '../lib/intake/reference';"
          )
          replace_exact(
              'src/scripts/intake-wizard.ts',
              "        element.name && element.name !== 'honeypot') names.add(element.name);",
              "        element.name && isIntakeAnswerFieldName(element.name)) names.add(element.name);",
              expected=2
          )
          replace_exact(
              'src/scripts/intake-server-validation-feedback.ts',
              "import { validateAndNormalizeIntake } from '../lib/intake/schema';\nimport { loadDraft } from '../lib/intake/storage';",
              "import { isIntakeAnswerFieldName } from '../lib/intake/form-fields';\nimport { validateAndNormalizeIntake } from '../lib/intake/schema';\nimport { loadDraft } from '../lib/intake/storage';"
          )
          replace_exact(
              'src/scripts/intake-server-validation-feedback.ts',
              ".filter((name) => name.length > 0 && name !== 'honeypot')",
              ".filter(isIntakeAnswerFieldName)"
          )
          PY

          cat > tests/intake/form-fields.test.ts <<'EOF'
          import { expect, test } from 'vitest';
          import { isIntakeAnswerFieldName } from '../../src/lib/intake/form-fields';

          test('only intake answer paths are collected from the form', () => {
            expect(isIntakeAnswerFieldName('business.email')).toBe(true);
            expect(isIntakeAnswerFieldName('needs.store.productTypes')).toBe(true);
            expect(isIntakeAnswerFieldName('consent.contactPermission')).toBe(true);
            expect(isIntakeAnswerFieldName('cf-turnstile-response')).toBe(false);
            expect(isIntakeAnswerFieldName('turnstileToken')).toBe(false);
            expect(isIntakeAnswerFieldName('honeypot')).toBe(false);
          });
          EOF

      - name: Confirm focused tests pass
        run: npx vitest run tests/intake/form-fields.test.ts tests/intake/wizard.test.ts tests/intake/server-validation-feedback.test.ts

      - name: Run complete verification
        shell: bash
        run: |
          npm run verify:content
          npm run verify:assets
          npm test
          npm run check
          PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA npm run build
          npm run verify:build

      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-turnstile-answer-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/intake/form-fields.ts src/scripts/intake-wizard.ts src/scripts/intake-server-validation-feedback.ts tests/intake/form-fields.test.ts tests/intake/wizard.test.ts .github/workflows/apply-turnstile-answer-boundary.yml
          git commit -m "Separate Turnstile metadata from intake answers"
          git push origin HEAD:fix/turnstile-answer-boundary
